pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'dev.architectury.loom') {
                useModule("dev.architectury:architectury-loom:${requested.version}")
            }
            if (requested.id.id == 'architectury-plugin') {
                useModule("architectury-plugin:architectury-plugin.gradle.plugin:${requested.version}")
            }
        }
    }

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'reactions'

include 'common'
include 'fabric'
include 'fabric-server-relay'
include 'neoforge'
include 'paper-plugin'
