plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    compileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    runtimeOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', rootProject.minecraft_dependency
    inputs.property 'fabric_api_dependency', rootProject.fabric_api_dependency

    filesMatching('fabric.mod.json') {
        expand version: project.version,
            minecraft_dependency: rootProject.minecraft_dependency,
            fabric_api_dependency: rootProject.fabric_api_dependency
    }
}

jar {
    dependsOn configurations.shadowBundle
    from {
        configurations.shadowBundle.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

