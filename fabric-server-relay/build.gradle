architectury {
    platformSetupLoomIde()
    fabric()
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', rootProject.minecraft_dependency
    inputs.property 'fabric_api_dependency', rootProject.fabric_api_dependency

    filesMatching('fabric.mod.json') {
        expand version: project.version,
            minecraft_dependency: rootProject.minecraft_dependency,
            fabric_api_dependency: rootProject.fabric_api_dependency
    }
}
